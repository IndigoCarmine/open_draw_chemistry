# Abbreviations with a formula but no structure to draw: ligands and reagents as they are
# written inside a label such as `PdCl2(amphos)2`, `Pd(dppf)Cl2` or `[(TMEDA)Zn(OH)(OTf)]3`.
# A label written with them has a formula and a molecular weight (status bar, analysis,
# reaction table) although Expand draws nothing for it.
#
# One [[group]] per abbreviation:
#   name     the usual spelling. No brackets, spaces or `·`.
#   aliases  other spellings in real use. Names are matched exactly as written, case included,
#            so a spelling counts only if it is listed here (`cod` lists `COD`, `TMEDA` lists
#            `tmeda`). List only spellings the literature uses, and none that is an element
#            symbol, a fragment's name or another group's spelling. A spelling whose letters
#            all read as element symbols (`COD`, `DBU`, `DPPF`) is taken for the group only
#            where it stands alone — a whole label or everything inside one pair of brackets —
#            so `Ni(COD)2` is the diene and `CH3COD` still acetaldehyde-d.
#   formula  the atoms of the group as it is written in a compound, elements only: an anionic
#            ligand is the group without its charge (acac = C5H7O2, Cp = C5H5).
#   note     what it stands for, for whoever checks the formula.
#
# Not needed here: anything that reads from elements and fragments already — OAc, OTf, OTs,
# OMe, PPh3, PCy3, P(tBu)3, NEt3, MeCN, Et2O — and abbreviations with a structure, which
# belong in `assets/fragments/` (THF, DMF, DCM, Tol). `thf` and `dmf` are here because a
# fragment has one spelling, and as ligands the two are written in lower case.
#
# `cargo test` checks every entry against an independently computed molecular weight
# (tests/formula_labels.rs): add the new entry there too.

