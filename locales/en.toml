# Appended to "Opened {name}" when a 3D file holds several structures; {n} is how many.
opened_first_record = { one = " (only the first of {n} structure)", other = " (only the first of {n} structures)" }
# Appended to "Opened {name}" when the file has flat coordinates. Quotes the 3D menu item.
opened_flat = ". The coordinates are flat, so create the 3D model with “Generate 3D from 2D”"
# Appended to "Opened {name}" when the 2D drawing was made from 3D coordinates.
opened_projected = ". The 2D layout is a projection of the 3D coordinates (clean up to tidy it)"
# Appended last when a 3D file was opened: it can only be saved as a ChemDraw file.
opened_save_note = ". To save, use “Save as…” to CDX/CDXML"
saved = "Saved {name}"
save_failed = "Could not save: {error}"
export_failed = "Could not export: {error}"
exported = "Exported to {path}"
