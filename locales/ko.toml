# Open DrawChemistry — 한국어 (ko) UI strings. Keys and syntax are the same as en.toml (see its
# header and locales/README.md). Context for each key is in the comments of en.toml.
#
# Terminology: 집합체 (assembly), 단량체 (monomer), 조각 (fragment), 단계 (assembly step),
# 역장, 이면각, 결합 길이, 결합각, 단위 세포, 격자 상수, 공간군, 비대칭 단위, 대칭 연산.
# Element names follow the Korean Chemical Society (대한화학회) 2014 names.
# Placeholders: to avoid 은/는 and 을/를 after a {placeholder}, messages put the value after a
# colon or use 을(를).
# Plurals: Korean has one form, so plural keys are plain strings.

