# Open DrawChemistry — 繁體中文 (zh-Hant, Taiwan usage) UI strings. Keys and syntax are the
# same as en.toml (see its header and locales/README.md). Context for each key is in the
# comments of en.toml.
#
# Taiwanese UI terms: 檔案 (file), 文件 (document), 資料夾, 設定, 儲存, 開啟, 匯出, 復原 /
# 取消復原, 剪貼簿, 視窗, 物件, 檢視, 預設, 字型, 按一下 / 按兩下 / 按右鍵, 拖曳, 最佳化.
# Chemistry: 組裝體 (assembly), 單體 (monomer), 片段 (fragment), 步驟 (assembly step), 力場,
# 雙面角, 鍵長, 鍵角, 參鍵, 晶胞, 晶胞參數, 空間群, 不對稱單元, 對稱操作.
# Plurals: Chinese has one form, so plural keys are plain strings.

