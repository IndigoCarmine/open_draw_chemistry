name: Release

# Pushing a `v*` tag builds installers for all three platforms and publishes
# them as a GitHub Release. `workflow_dispatch` builds the same artifacts
# without releasing, which is handy for testing changes to this file.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  BIN_NAME: open_draw_chemistry
  APP_NAME: open-draw-chemistry
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- Windows --
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Derive version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # 3D generation links OpenBabel from the prebuilt attached to the openbabel_rs release.
      - name: Fetch prebuilt OpenBabel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-openbabel.sh

      - name: Build
        run: cargo build --release

      # The executable needs OpenBabel beside it (its DLLs, its .obf plugins and its data
      # directory) and the Visual C++ runtime (msvcp140 & co., deployed app-local), so the
      # portable build is a zip of this folder rather than a lone .exe; the installer installs
      # the same folder. See scripts/stage-windows.sh.
      - name: Stage the app
        shell: bash
        run: bash scripts/stage-windows.sh target/stage/windows

      # The staged app must find its own OpenBabel, not the build tree's: hide the latter and
      # ask the app to read a file, generate 3D models, write a SMILES and export.
      - name: Check the staged app's OpenBabel
        shell: bash
        run: |
          mv third_party/openbabel-prebuilt third_party/openbabel-prebuilt.hidden
          PATH=/c/Windows/System32:/c/Windows target/stage/windows/${BIN_NAME}.exe --check-openbabel
          mv third_party/openbabel-prebuilt.hidden third_party/openbabel-prebuilt

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          # Inno Setup 6 is preinstalled on the windows-latest runner image.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p out
          portable="${APP_NAME}-${{ steps.version.outputs.value }}-windows-x64"
          cp -r target/stage/windows "$portable"
          7z a "out/$portable.zip" "$portable"
          cp dist/*.exe out/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS --
  macos:
    name: macOS installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Derive version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # cargo-bundle is not available via taiki-e/install-action, so it has to be
      # compiled. Swatinem/rust-cache above keeps this out of the critical path
      # on subsequent runs.
      - name: Install cargo-bundle and create-dmg
        run: |
          cargo install cargo-bundle --locked
          brew install create-dmg

      # Each architecture links the OpenBabel prebuilt made for it, so each build gets its own
      # (OPENBABEL_SYS_PREBUILT_DIR overrides the host default in .cargo/config.toml).
      - name: Fetch prebuilt OpenBabel (both architectures)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/fetch-openbabel.sh x86_64-apple-darwin "$RUNNER_TEMP/openbabel-x86_64"
          bash scripts/fetch-openbabel.sh aarch64-apple-darwin "$RUNNER_TEMP/openbabel-aarch64"

      - name: Build (both architectures)
        run: |
          OPENBABEL_SYS_PREBUILT_DIR="$RUNNER_TEMP/openbabel-x86_64" \
            cargo build --release --target x86_64-apple-darwin
          OPENBABEL_SYS_PREBUILT_DIR="$RUNNER_TEMP/openbabel-aarch64" \
            cargo build --release --target aarch64-apple-darwin

      - name: Bundle .app
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # cargo-bundle reads [package.metadata.bundle] from Cargo.toml and
          # generates Info.plist and the Resources/ layout for us. It only ever
          # bundles one architecture (the same environment as its build above, so
          # nothing is rebuilt); scripts/bundle-macos.sh then swaps in the universal
          # binary and adds OpenBabel.
          OPENBABEL_SYS_PREBUILT_DIR="$RUNNER_TEMP/openbabel-aarch64" \
            cargo bundle --release --target aarch64-apple-darwin

          APP="target/aarch64-apple-darwin/release/bundle/osx/Open DrawChemistry.app"

          # cargo-bundle takes the version from Cargo.toml; the tag is the real
          # source of truth, so overwrite both version keys with it.
          plutil -replace CFBundleVersion -string "${VERSION}" "${APP}/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "${VERSION}" "${APP}/Contents/Info.plist"

          # The universal executable, OpenBabel's universal dylibs and plugins in
          # Contents/Frameworks, its data in Contents/Resources, the rpath, and the
          # ad-hoc signatures (the minimum Apple Silicon needs to launch the app at
          # all; it is not notarisation) -- signed last, after every modification.
          bash scripts/bundle-macos.sh "${APP}" \
            "target/x86_64-apple-darwin/release/${BIN_NAME}" \
            "target/aarch64-apple-darwin/release/${BIN_NAME}" \
            "$RUNNER_TEMP/openbabel-x86_64" "$RUNNER_TEMP/openbabel-aarch64"

      # The bundled app must find its own OpenBabel, not the build machine's: hide the latter
      # and ask each slice to read a file, generate 3D models, write a SMILES and export.
      - name: Check the bundle's OpenBabel
        run: |
          APP="target/aarch64-apple-darwin/release/bundle/osx/Open DrawChemistry.app"
          mv "$RUNNER_TEMP/openbabel-x86_64" "$RUNNER_TEMP/openbabel-x86_64.hidden"
          mv "$RUNNER_TEMP/openbabel-aarch64" "$RUNNER_TEMP/openbabel-aarch64.hidden"
          arch -arm64 "${APP}/Contents/MacOS/${BIN_NAME}" --check-openbabel
          if arch -x86_64 /usr/bin/true 2> /dev/null; then
            arch -x86_64 "${APP}/Contents/MacOS/${BIN_NAME}" --check-openbabel
          else
            echo "::warning::Rosetta is not available; the x86_64 slice was not run"
          fi

      - name: Build .dmg
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          APP="target/aarch64-apple-darwin/release/bundle/osx/Open DrawChemistry.app"
          create-dmg \
            --volname "Open DrawChemistry" \
            --window-size 500 300 \
            --icon "Open DrawChemistry.app" 130 130 \
            --app-drop-link 350 130 \
            "${APP_NAME}-${VERSION}-macos-universal.dmg" \
            "${APP}"

      - name: Stage artifacts
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p out
          mv "${APP_NAME}-${VERSION}-macos-universal.dmg" out/

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux --
  linux:
    name: Linux installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Derive version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgtk-3-dev \
            libssl-dev \
            desktop-file-utils \
            file \
            patchelf

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      # 3D generation links OpenBabel from the prebuilt attached to the openbabel_rs release.
      - name: Fetch prebuilt OpenBabel
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-openbabel.sh

      - name: Build
        run: cargo build --release

      # The .deb and the AppImage carry the app with its own OpenBabel (libopenbabel, libinchi,
      # the plugins and the data) under usr/lib/open-draw-chemistry and
      # usr/share/open-draw-chemistry, the binary's rpath pointing there relative to itself.
      # See scripts/stage-linux.sh. The DEBIAN directory marks target/deb-root as the
      # package's tree for dpkg-shlibdeps (see [package.metadata.deb] in Cargo.toml).
      - name: Stage the app
        run: |
          bash scripts/stage-linux.sh target/deb-root
          mkdir -p target/deb-root/DEBIAN
          bash scripts/stage-linux.sh AppDir

      # The staged app must find its own OpenBabel, not the build tree's: hide the latter and
      # ask the app to read a file, generate 3D models, write a SMILES and export (it exits
      # before opening a window).
      - name: Check the staged app's OpenBabel
        run: |
          mv third_party/openbabel-prebuilt third_party/openbabel-prebuilt.hidden
          target/deb-root/usr/bin/${BIN_NAME} --check-openbabel
          AppDir/usr/bin/${BIN_NAME} --check-openbabel
          mv third_party/openbabel-prebuilt.hidden third_party/openbabel-prebuilt

      - name: Build .deb
        env:
          VERSION: ${{ steps.version.outputs.value }}
        # --deb-version keeps the package version in step with the git tag
        # without having to rewrite Cargo.toml.
        run: |
          cargo deb --no-build --deb-version "${VERSION}"
          dpkg-deb --info target/debian/*.deb
          dpkg-deb --contents target/debian/*.deb | grep -e open_draw_chemistry -e openbabel | head -n 20

      - name: Build AppImage
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # AppDir/usr already holds the app and its OpenBabel (staged above).
          APPDIR=AppDir
          mkdir -p "${APPDIR}/usr/share/applications" \
                   "${APPDIR}/usr/share/icons/hicolor/512x512/apps"

          cp installer/linux/AppRun "${APPDIR}/AppRun"
          chmod +x "${APPDIR}/AppRun"

          # appimagetool wants the .desktop and icon at the AppDir root as well
          # as in their usual share/ locations.
          cp "installer/linux/${APP_NAME}.desktop" "${APPDIR}/"
          cp "installer/linux/${APP_NAME}.desktop" "${APPDIR}/usr/share/applications/"
          cp resources/icon.png "${APPDIR}/${APP_NAME}.png"
          cp resources/icon.png "${APPDIR}/usr/share/icons/hicolor/512x512/apps/${APP_NAME}.png"

          desktop-file-validate "${APPDIR}/${APP_NAME}.desktop"

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          # --appimage-extract-and-run avoids needing FUSE, which the runner lacks.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "${APPDIR}" \
            "${APP_NAME}-${VERSION}-linux-x86_64.AppImage"

      - name: Stage artifacts
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p out
          mv ./*.AppImage out/
          cp target/debian/*.deb out/

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------- Release --
  release:
    name: Publish release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    # Only tags produce a release; workflow_dispatch runs stop after building.
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
