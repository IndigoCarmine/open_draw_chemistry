name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libgtk-3-dev libssl-dev

      # OpenBabel (required) is linked from the prebuilt attached to the openbabel_rs release;
      # .cargo/config.toml points openbabel-sys at where this unpacks it.
      - name: Fetch prebuilt OpenBabel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-openbabel.sh

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libgtk-3-dev libssl-dev

      # OpenBabel (required) is linked from the prebuilt attached to the openbabel_rs release;
      # .cargo/config.toml points openbabel-sys at where this unpacks it.
      - name: Fetch prebuilt OpenBabel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-openbabel.sh

      # On Windows OpenBabel loads its .obf plugins only from the directory of openbabel-3.dll,
      # so openbabel-sys's build script copies the DLLs and plugins beside the test binaries
      # (target/debug and target/debug/deps), outside its OUT_DIR. Swatinem/rust-cache deletes
      # those copies before saving (cleanProfileTarget keeps only dependency-named files in
      # deps/), and after a cache hit cargo sees openbabel-sys up to date and never reruns the
      # script, so every OpenBabel test fails with "Unable to find OpenBabel plugins". Cleaning
      # openbabel-sys makes the script run, and copy them, again. This step can go once
      # openbabel-sys reruns its build script when a copy is missing (rerun-if-changed on them).
      - name: Rebuild openbabel-sys so its plugins sit beside the test binaries
        if: runner.os == 'Windows'
        run: cargo clean -p openbabel-sys

      - run: cargo test --all-targets
      - run: cargo build --release
