[package]
name = "open_draw_chemistry"
version = "0.6.3"
edition = "2024"
# Raised from edition 2024's 1.85 by the egui-winit fork in [patch.crates-io].
rust-version = "1.95"
description = "A chemical structure and reaction drawing application (ChemDraw-compatible CDX/CDXML)"
authors = ["IndigoCarmine"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/IndigoCarmine/open_draw_chemistry"
readme = "README.md"

[dependencies]
# `wgpu` because the 3D viewer (moleucle_3dview_rs) renders through it; main.rs selects it.
eframe = { version = "0.37.0", features = ["persistence", "wgpu"] }
egui = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }

# The 2D structure editor widget, reaction schemes and CDX/CDXML codecs. Pinned to a rev
# because it is not on crates.io; it must share this app's egui version.
chembuider-rs = { git = "https://github.com/IndigoCarmine/chembuider-rs", rev = "fbfa7e2589df69151fffd93d3d3f512bb14c598b" }
rfd = "0.18.0"
# The per-user config directory, where the user's own fragments are kept.
dirs = "7.0.0"
# Reads and writes fragment files in chembuider-rs's JSON format.
serde_json = "1.0.154"
# The parameter scan's energy curve and heatmap (see `src/ui/scan.rs`). 0.38 is the release
# built against egui 0.37.
egui_plot = "0.38.0"

# UI translations (see `src/i18n/`): the catalogs in `locales/` are TOML, the OS locale picks
# the first language, and the system font fallback is told the language so Han characters are
# drawn in a Japanese, Simplified or Traditional Chinese font as fits. All three are already in
# eframe's dependency tree.
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
sys-locale = "0.3.2"
egui_system_font_provider = "0.37.0"

# The 3D viewer (wgpu; the egui 0.37 port). MIT. Pinned to a rev for the same reason as above.
moleucle_3dview_rs = { git = "https://github.com/IndigoCarmine/moleucle_3dview_rs", rev = "0a110d4b7ea0ce57db8688957feff67aa89171d7" }
# The viewer's vector types, needed to drive its camera and renderer directly.
lin_alg = { version = "1.4.3", features = ["computer_graphics"] }

# AcaudaOffice's embedded objects without COM (see `src/acauda.rs`). Dual MIT/Apache-2.0. Pinned
# to a rev because it is not on crates.io; `default-features = false` because only hosts read
# manifests.
acauda-embed = { git = "https://github.com/IndigoCarmine/acauda-embed", rev = "9b78881a2d703fe97483f64f0c99cb851226df80", default-features = false }

# Molecular mechanics (see `src/three_d/engine.rs` and `src/scan/energy.rs`): UFF and
# MMFF94/94s energies and minimisation, and the ETKDG embedding that builds 3D models from the
# drawing; also reading 3D files and laying a read structure out in 2D (`src/three_d/read.rs`).
# Pure Rust (ports of RDKit's, BSD-3-Clause). Pinned to a tag: not on crates.io.
molecule_optimizer_rs = { git = "https://github.com/IndigoCarmine/molecule_optimizer_rs", tag = "v0.2.0" }

# Only used to decode the embedded window icon, so the heavy default codecs are off.
image = { version = "0.25.10", default-features = false, features = ["png"] }

# The startup update check and automatic install (see `src/update/`): the ed25519 and SHA-256
# that verify a download, and the rest for comparing versions, vetting URLs, the download's
# temporary directory and the Release page.
ed25519-dalek = { version = "3.0.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
semver = "1.0.28"
url = "2.5.8"
tempfile = "3.27.0"
webbrowser = "1.2.6"

# HTTPS for the update check through the OS's own TLS: SChannel on Windows, Security.framework
# on macOS. `-no-default` because the plain feature adds Mozilla's root certificates, under
# CDLA-Permissive-2.0, when the OS's are the ones wanted. Not on Linux, where native-tls is the
# `openssl` crate: there the update check runs the system's curl (see `src/update/curl.rs`).
# `openssl` is still in Cargo.lock for that reason, but nothing builds it.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "3.5.1", default-features = false, features = ["native-tls-no-default"] }

# Windows OLE: Copy publishes an OLE data object (OleSetClipboard), so Word/PowerPoint paste
# the structure as an embedded ChemDraw object (see `src/ole/`), and the OLE server
# (`src/ole_server/`) edits such objects: COM objects, structured storage, metafiles and the
# registry. `windows-core` is needed by the `#[implement]` macro. Same version eframe/wgpu
# already pull in.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

# Upstream winit/egui-winit do not implement native drag-and-drop on Wayland.
# These forks do; without them DnD silently does nothing under a Wayland session.
[patch.crates-io]
winit = { git = "https://github.com/IndigoCarmine/winit", branch = "wayland-native-dnd" }
egui-winit = { git = "https://github.com/IndigoCarmine/egui-winit", branch = "main" }

[build-dependencies]
winresource = "0.1.34"

# The manifest feature: the tests prove the sample manifest finds ChemDraw's objects.
[dev-dependencies]
acauda-embed = { git = "https://github.com/IndigoCarmine/acauda-embed", rev = "9b78881a2d703fe97483f64f0c99cb851226df80" }

# --- cargo-bundle: drives the macOS .app built by .github/workflows/release.yml ---
# `cargo bundle` generates Info.plist from these keys, so there is no plist to
# hand-maintain. Build the bundle locally with `cargo bundle --release`.
[package.metadata.bundle]
name = "Open DrawChemistry"
identifier = "io.github.indigocarmine.open-draw-chemistry"
icon = ["resources/icon.icns"]
category = "Education"
short_description = "Chemical structure and reaction drawing"
long_description = """
Draw chemical structures and reaction schemes, and read and write ChemDraw
CDX/CDXML files.
"""

# Release binaries: smaller and faster, at the cost of longer link times.
# The force fields and the embedder are numeric loops that run tens of times slower unoptimised;
# optimise them in debug builds and tests too, so Generate, Optimize and scans keep their speed.
[profile.dev.package.molecule_optimizer_rs]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# --- cargo-deb: used by .github/workflows/release.yml to build the Linux .deb ---
[package.metadata.deb]
maintainer = "IndigoCarmine"
copyright = "2026, IndigoCarmine"
license-file = ["LICENSE", "0"]
extended-description = "Draw chemical structures and reaction schemes; read and write ChemDraw CDX/CDXML files."
section = "science"
priority = "optional"
# eframe dlopens its GL/X11/Wayland libraries rather than linking them, so `$auto`
# does not detect them. Without listing them the package installs cleanly and
# then fails to start on a minimal system. (`$auto` does find what the binary links: libc and
# the like.)
depends = "$auto, libxkbcommon0, libwayland-client0, libegl1, libgl1, libx11-6, libxcursor1, libxi6, libxrandr2"
# The update check runs it (see `src/update/curl.rs`); without it the app just never asks.
recommends = "curl"
# The app comes from the tree scripts/stage-linux.sh lays out in target/deb-root.
assets = [
    ["target/deb-root/usr/bin/open_draw_chemistry", "usr/bin/", "755"],
    ["installer/linux/open-draw-chemistry.desktop", "usr/share/applications/", "644"],
    ["resources/icon.png", "usr/share/icons/hicolor/512x512/apps/open-draw-chemistry.png", "644"],
]
