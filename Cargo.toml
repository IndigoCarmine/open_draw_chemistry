[package]
name = "open_draw_chemistry"
version = "0.1.0"
edition = "2024"
# Raised from edition 2024's 1.85 by the egui-winit fork in [patch.crates-io].
rust-version = "1.95"
description = "A chemical structure and reaction drawing application (ChemDraw-compatible CDX/CDXML)"
authors = ["IndigoCarmine"]
# GPL because the 3D builder links OpenBabel (GPL-2.0).
license = "GPL-2.0-or-later"
repository = "https://github.com/IndigoCarmine/open_draw_chemistry"
readme = "README.md"

[dependencies]
# `wgpu` because the 3D viewer (moleucle_3dview_rs) renders through it; main.rs selects it.
eframe = { version = "0.37.0", features = ["persistence", "wgpu"] }
egui = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }

# The 2D structure editor widget, reaction schemes and CDX/CDXML codecs. Pinned to a rev
# because it is not on crates.io; it must share this app's egui version.
chembuider-rs = { git = "https://github.com/IndigoCarmine/chembuider-rs", rev = "dadc41108998f5f7427e107063ee3f8e33590c75" }
rfd = "0.17.2"
# The per-user config directory, where the user's own fragments are kept.
dirs = "6.0.0"
# Reads and writes fragment files in chembuider-rs's JSON format.
serde_json = "1.0.154"

# The 3D viewer (wgpu; the egui 0.37 port). MIT. Pinned to a rev for the same reason as above.
moleucle_3dview_rs = { git = "https://github.com/IndigoCarmine/moleucle_3dview_rs", rev = "0a110d4b7ea0ce57db8688957feff67aa89171d7" }
# The viewer's vector types, needed to drive its camera and renderer directly.
lin_alg = { version = "1.4.3", features = ["computer_graphics"] }

# 2D → 3D generation and force-field optimisation (see `src/three_d/`). Behind the `openbabel`
# feature because it needs a prebuilt OpenBabel (`scripts/fetch-openbabel.sh`) or CMake.
openbabel = { git = "https://github.com/IndigoCarmine/openbabel_rs", tag = "v0.4.3", optional = true }

# Only used to decode the embedded window icon, so the heavy default codecs are off.
image = { version = "0.25.10", default-features = false, features = ["png"] }

# Upstream winit/egui-winit do not implement native drag-and-drop on Wayland.
# These forks do; without them DnD silently does nothing under a Wayland session.
[patch.crates-io]
winit = { git = "https://github.com/IndigoCarmine/winit", branch = "wayland-native-dnd" }
egui-winit = { git = "https://github.com/IndigoCarmine/egui-winit", branch = "main" }

[features]
default = ["openbabel"]
# 3D generation through OpenBabel. Without it the app builds anywhere and the 3D panel says that
# generation is unavailable (the macOS x86_64 release slice, which has no prebuilt OpenBabel).
openbabel = ["dep:openbabel"]

[build-dependencies]
winresource = "0.1.34"

# --- cargo-bundle: drives the macOS .app built by .github/workflows/release.yml ---
# `cargo bundle` generates Info.plist from these keys, so there is no plist to
# hand-maintain. Build the bundle locally with `cargo bundle --release`.
[package.metadata.bundle]
name = "Open DrawChemistry"
identifier = "io.github.indigocarmine.open-draw-chemistry"
icon = ["resources/icon.icns"]
category = "Education"
short_description = "Chemical structure and reaction drawing"
long_description = """
Draw chemical structures and reaction schemes, and read and write ChemDraw
CDX/CDXML files.
"""

# Release binaries: smaller and faster, at the cost of longer link times.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# --- cargo-deb: used by .github/workflows/release.yml to build the Linux .deb ---
[package.metadata.deb]
maintainer = "IndigoCarmine"
copyright = "2026, IndigoCarmine"
license-file = ["LICENSE", "0"]
extended-description = "Draw chemical structures and reaction schemes; read and write ChemDraw CDX/CDXML files."
section = "science"
priority = "optional"
# eframe dlopens its GL/X11/Wayland libraries rather than linking them, so `$auto`
# only ever detects libc. Without listing them the package installs cleanly and
# then fails to start on a minimal system.
depends = "$auto, libxkbcommon0, libwayland-client0, libegl1, libgl1, libx11-6, libxcursor1, libxi6, libxrandr2"
assets = [
    ["target/release/open_draw_chemistry", "usr/bin/", "755"],
    ["installer/linux/open-draw-chemistry.desktop", "usr/share/applications/", "644"],
    ["resources/icon.png", "usr/share/icons/hicolor/512x512/apps/open-draw-chemistry.png", "644"],
]
